// ==================== PWA 安装提示 ====================
let deferredPrompt = null;

// 监听 beforeinstallprompt 事件
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    console.log('[PWA] beforeinstallprompt event fired');
    
    // 显示安装横幅（延迟 3 秒，避免打扰）
    setTimeout(() => {
        const banner = document.getElementById('install-banner');
        if (banner && !localStorage.getItem('pwa-banner-dismissed')) {
            banner.classList.add('visible');
        }
    }, 3000);
});

function installPWA() {
    if (!deferredPrompt) {
        showToast('安装提示不可用');
        return;
    }
    
    deferredPrompt.prompt();
    
    deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
            console.log('[PWA] User accepted the install prompt');
            showToast('应用已安装到桌面');
        } else {
            console.log('[PWA] User dismissed the install prompt');
        }
        deferredPrompt = null;
        document.getElementById('install-banner').classList.remove('visible');
    });
}

function dismissInstallBanner() {
    document.getElementById('install-banner').classList.remove('visible');
    localStorage.setItem('pwa-banner-dismissed', 'true');
}

// ==================== BM25 检索引擎 ====================
class BM25Search {
    constructor(index) {
        this.k1 = index.k1;
        this.b = index.b;
        this.N = index.N;
        this.avgdl = index.avgdl;
        this.df = index.df;
        this.invertedIndex = index.inverted_index;
    }

    tokenize(text) {
        const tokens = [];
        const chineseChars = text.match(/[\u4e00-\u9fff]/g) || [];
        tokens.push(...chineseChars);
        for (let i = 0; i < chineseChars.length - 1; i++) {
            tokens.push(chineseChars[i] + chineseChars[i+1]);
        }
        const engWords = text.toLowerCase().match(/[a-zA-Z]+/g) || [];
        tokens.push(...engWords);
        const numbers = text.match(/\d+/g) || [];
        tokens.push(...numbers);
        return tokens;
    }

    search(query, topK = 15) {
        console.log('Searching for:', query);
        const queryTokens = this.tokenize(query);
        const scores = new Map();

        for (const token of queryTokens) {
            const postings = this.invertedIndex[token];
            if (!postings) continue;
            const idf = Math.log((this.N - (this.df[token] || 0) + 0.5) / ((this.df[token] || 0) + 0.5) + 1);
            for (const [docId, weight] of postings) {
                const current = scores.get(docId) || 0;
                scores.set(docId, current + idf * weight);
            }
        }

        const ranked = Array.from(scores.entries())
            .sort((a, b) => b[1] - a[1])
            .slice(0, topK);
        return ranked;
    }
}

function extractKeywords(query) {
    // 移除常见停用词和通用词
    const stopwords = new Set([
        '的', '了', '在', '是', '我', '有', '和', '就', '不', '人', '都', '一', '一个', '上', '也', '很', '到', '说', '要', '去', '你', '会', '着', '没有', '看', '好', '自己', '这', '那', 
        '什么', '怎么', '为什么', '如何', '哪些', '包含', '请问', '政策', '城市', '更新', '条例', '文件', '内容', '规定', '要求', '措施', '办法', '方案', '制度'
    ]);
    
    // 政策领域关键词（用于补充）
    const policyKeywords = [
        '资金', '金融', '工具', '补贴', '融资', '贷款', '基金', '投资', '支持', '补助', '奖励',
        '审批', '许可', '核准', '备案', '登记', '程序', '流程', '时限', '优化', '简化',
        '规划', '土地', '用地', '建设', '居住', '产业', '设施', '公共', '空间', '区域', '轨道', '人防', '消防', '交通',
        '历史', '文化', '保护', '传承', '绿色', '低碳', '节能', '环保', '生态',
        '激励', '监督', '管理', '评估', '考核', '责任', '权利', '义务', '保障'
    ];
    
    // 提取中文词语（至少2个字符）
    const chineseWords = query.match(/[\u4e00-\u9fff]{2,}/g) || [];
    
    // 过滤停用词，保留有意义的实义词
    const keywords = chineseWords.filter(word => {
        if (stopwords.has(word)) return false;
        return true;
    });
    
    // 如果没有提取到关键词，使用政策领域关键词中与问题相关的词
    if (keywords.length === 0) {
        for (const keyword of policyKeywords) {
            if (query.includes(keyword)) {
                keywords.push(keyword);
            }
        }
    }
    
    console.log('Query:', query, 'Extracted keywords:', keywords);
    return keywords;
}

// ==================== 高亮函数 ====================
function highlightKeywords(text, keywords) {
    if (!keywords || keywords.length === 0) return text;
    
    let highlighted = text;
    
    // 对每个关键词进行高亮
    keywords.forEach(keyword => {
        const regex = new RegExp(`(${keyword})`, 'g');
        highlighted = highlighted.replace(regex, '<span class="highlight">$1</span>');
    });
    
    return highlighted;
}

// ==================== 非北京城市更新问题检测 ====================
function isNonBeijingUrbanRenewal(query) {
    // 北京相关地名
    const beijingPatterns = /北京|首都|亦庄|东城|西城|朝阳|海淀|丰台|石景山|通州|大兴|昌平|顺义|房山|门头沟|怀柔|平谷|密云|延庆/;
    // 城市更新相关政策关键词
    const urbanRenewalPatterns = /城市更新|建设用地|功能混合|过渡期|规划许可|施工许可|建筑规模|工业用地|产业规划|审批|土地|更新|改造|整治|规划|建设|许可|豁免|存量|低效|腾退/;

    // 明确包含北京城市更新相关 → 放行
    if (beijingPatterns.test(query) && urbanRenewalPatterns.test(query)) return false;

    // 明确包含"城市更新"且上下文暗示政策咨询 → 放行（不强制有北京关键词，因为上下文就是北京）
    const contextOk = /城市更新条例|城市更新政策|城市更新项目|城市更新规划|城市更新审批|城市更新资金|城市更新土地/;
    if (contextOk.test(query)) return false;
    if (/城市更新/.test(query) && !/上海|深圳|广州|杭州|成都|武汉/.test(query)) return false;

    // 明确非城市更新领域的日常问题 → 拒绝
    const clearlyIrrelevant = /股票|基金理财|游戏攻略|电影推荐|音乐播放|外卖|打车|旅游攻略|健身教程|烹饪食谱|宠物饲养|汽车评测|手机评测|房价预测|天气预报|娱乐八卦|体育赛事|看病|挂号|考试|学习|英语|数学|编程|代码|bug|debug|python|java|javascript/i;
    if (clearlyIrrelevant.test(query)) return true;

    // 提及其他城市政策 → 拒绝
    if (/上海.*更新|深圳.*更新|广州.*更新|杭州.*更新|成都.*更新|武汉.*更新/.test(query)) return true;
    if (/上海.*条例|深圳.*条例|广州.*条例|杭州.*条例/.test(query)) return true;

    // 没有命中任何城市更新或北京关键词 → 可能不相关，拒绝
    if (!urbanRenewalPatterns.test(query) && !beijingPatterns.test(query) && !/政策|条例|规定|法规|办法|细则|通知|意见|批复/.test(query)) {
        // 完全无法判断意图的短文本，尝试允许通过（用户可能在问政策）
        if (query.length <= 3) return false;
        return true;
    }

    return false;
}

// ==================== 条款编号与结构提取 ====================
function extractClauseInfo(text) {
    const clauses = [];

    // "第X条" 模式（法律条文）
    const tiaoPattern = /第([一二三四五六七八九十百千\d]+)条\s*([^第]{0,250}?)(?=第[一二三四五六七八九十百千\d]+条|$)/g;
    let match;
    while ((match = tiaoPattern.exec(text)) !== null) {
        clauses.push({ type: '条', number: match[1], content: match[2].trim().replace(/\n/g, '') });
        if (clauses.length >= 10) break;
    }

    // "第X章" 模式
    if (clauses.length === 0) {
        const zhangPattern = /第([一二三四五六七八九十百千\d]+)章\s*([^\n]{0,120})/g;
        while ((match = zhangPattern.exec(text)) !== null) {
            clauses.push({ type: '章', number: match[1], content: match[2].trim() });
        }
    }

    // "一、二、三、" 模式（政策文件章节号）
    if (clauses.length === 0) {
        const sectionPattern = /([一二三四五六七八九十]+)、\s*([^\n]{0,120})/g;
        while ((match = sectionPattern.exec(text)) !== null) {
            clauses.push({ type: '节', number: match[1], content: match[2].trim() });
            if (clauses.length >= 8) break;
        }
    }

    // "(一)(二)(三)" 子条款模式
    if (clauses.length === 0) {
        const subPattern = /（([一二三四五六七八九十]+)）\s*([^\n]{0,150})/g;
        while ((match = subPattern.exec(text)) !== null) {
            clauses.push({ type: '项', number: match[1], content: match[2].trim() });
            if (clauses.length >= 8) break;
        }
    }

    return clauses;
}

// ==================== 适用范围提取 ====================
function extractScope(text) {
    const scopePatterns = [
        /适用范围[：:]\s*([^\n。；]{0,250})/,
        /适用对象[：:]\s*([^\n。；]{0,250})/,
        /本[条例|细则|办法|意见|规定|通知]适用于\s*([^\n。；]{0,250})/,
        /适用于\s*([^\n。；]{0,200})/,
    ];

    for (const pattern of scopePatterns) {
        const match = text.match(pattern);
        if (match) return match[1].trim();
    }
    return null;
}

// ==================== 文本智能截断 ====================
function smartTruncate(text, maxLen) {
    if (text.length <= maxLen) return text;
    // 优先在句号处截断
    const cutPoint = text.lastIndexOf('。', maxLen);
    if (cutPoint > maxLen * 0.5) return text.substring(0, cutPoint + 1);
    // 其次在分号处
    const semiCut = text.lastIndexOf('；', maxLen);
    if (semiCut > maxLen * 0.5) return text.substring(0, semiCut + 1);
    return text.substring(0, maxLen) + '...';
}

                const highlightedContent = highlightKeywords(smartTruncate(c.content, 200), queryKeywords);
                clauseHtml += `<li><strong>第${c.number}${c.type}</strong>：${highlightedContent}</li>`;
            });
            clauseHtml += '</ol></div>';
        }

        // 适用范围展示
        let scopeHtml = '';
        if (scope) {
            const highlightedScope = highlightKeywords(smartTruncate(scope, 250), queryKeywords);
            scopeHtml = `<div class="scope-section"><span class="scope-label">适用范围</span><p>${highlightedScope}</p></div>`;
        }

        // 核心内容展示（第一段，排除条款开头）
        const firstChunk = info.chunks.sort((a, b) => b.score - a.score)[0];
        let coreSnippet = firstChunk.text;

        // 如果已有条款提取，核心内容取非条款部分的摘要
        if (clauseInfos.length > 0) {
            // 取第一条条款之前的内容作为概述
            const firstClauseIdx = coreSnippet.search(/第[一二三四五六七八九十百千\d]+条/);
            if (firstClauseIdx > 10) {
                coreSnippet = coreSnippet.substring(0, firstClauseIdx).trim();
            } else {
                // 条款紧挨开头，取中间概述性文字
                coreSnippet = coreSnippet.substring(0, 350).trim();
            }
        } else {
            coreSnippet = coreSnippet.substring(0, 400).trim();
        }

        const highlightedCore = highlightKeywords(smartTruncate(coreSnippet, 400), queryKeywords);

        answerParts.push({
            policyName: policyName,
            source: source,
            topic: info.topic,
            relevance: relPct,
            publishDate: publishDate,
            publishOrg: publishOrg,
            coreSnippet: highlightedCore,
            clauseHtml: clauseHtml,
            scopeHtml: scopeHtml,
            clauseInfos: clauseInfos
        });
    }

    // 构建专家格式答案
    let answer = '';

    // 多个政策来源时添加对比提示
    if (answerParts.length > 1) {
        answer += `<div class="multi-policy-hint">为您检索到 <strong>${answerParts.length}</strong> 份相关政策文件，按相关度排序：</div>`;
    }

    answerParts.forEach((part, i) => {
        const policyName = part.policyName;
        const metaParts = [];
        if (part.publishDate) metaParts.push(`发布时间：${part.publishDate}`);
        if (part.publishOrg) metaParts.push(`发布单位：${part.publishOrg}`);
        metaParts.push(`相关度：${part.relevance}%`);

        // 提取第一条条款作为主条款引用
        let basisClause = '';
        if (part.clauseInfos.length > 0) {
            const firstClause = part.clauseInfos[0];
            basisClause = `第${firstClause.number}${firstClause.type}`;
        }

        answer += `
<div class="policy-answer expert-format">
    <div class="policy-name">${escapeHtml(policyName)}</div>
    <div class="policy-meta">${metaParts.join(' | ')}</div>
    <div class="policy-core">
        <div class="core-label">核心内容</div>
        <div class="core-text">${part.coreSnippet}</div>
    </div>
    ${part.clauseHtml}
    ${part.scopeHtml}
    <div class="policy-basis">
        <span class="basis-icon">政策依据</span>
        <span class="basis-text">${escapeHtml(part.source)}${basisClause ? ' ' + basisClause : ''}</span>
    </div>
</div>`;
    });

    if (answerParts.length > 0) {
        answer += `<p class="disclaimer">以上内容严格基于北京市城市更新相关政策文件原文，知识库截至2026年5月。如需核查完整条款，请点击下方来源标签查看原文。</p>`;
    }

    return { answer, sources, topChunks: top5, keywords: queryKeywords };
}

// ==================== UI 交互函数 ====================
function sendMessage() {
    console.log('sendMessage called');
    const input = document.getElementById('chat-input');
    const query = input.value.trim();
    if (!query || isLoading) return;

    const welcome = document.getElementById('welcome');
    if (welcome) welcome.style.display = 'none';

    appendMessage('user', query);
    input.value = '';
    document.getElementById('send-btn').disabled = true;
    isLoading = true;

    // 显示加载状态
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'loading-indicator';
    loadingDiv.innerHTML = `
        <div class="spinner"></div>
        <span>正在检索政策数据库...</span>
    `;
    document.getElementById('chat-messages').appendChild(loadingDiv);
    document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;

    // 模拟短暂延迟
    setTimeout(() => {
        const result = retrieveAndAnswer(query);
        
        // 移除加载状态
        const loadingIndicator = document.querySelector('.loading-indicator');
        if (loadingIndicator) loadingIndicator.remove();

        const assistantDiv = appendMessage('assistant', result.answer);

        if (result.sources.length > 0) {
            appendSources(assistantDiv, result.sources);
        }

        document.getElementById('send-btn').disabled = false;
        document.getElementById('chat-input').focus();
        isLoading = false;
    }, 500);
}

function appendMessage(role, content) {
    const container = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = `message ${role}`;

    const label = role === 'user' ? '👤 您' : '🤖 智能助手';
    const formattedContent = role === 'assistant' ? content : escapeHtml(content);

    div.innerHTML = `
        <div class="role-label">${label}</div>
        <div class="bubble">${formattedContent}</div>
    `;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return div;
}

function appendSources(div, sources) {
    let html = '<div class="sources-panel"><span class="sources-label">📎 引用来源:</span><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">';
    sources.forEach(s => {
        const shortName = s.source.length > 25 ? s.source.substring(0,25)+'...' : s.source;
        html += `<span class="source-tag" onclick="viewSourceFullText('${escapeHtml(s.source)}','${escapeHtml(s.topic)}')" title="相关度:${s.relevance}%">
            📄 ${escapeHtml(shortName)}
            <div class="relevance-bar"><div class="relevance-bar-fill" style="width:${s.relevance}%"></div></div>
        </span>`;
    });
    html += '</div></div>';
    div.querySelector('.bubble').insertAdjacentHTML('afterend', html);
}

function viewSourceFullText(source, topic) {
    // 找到该来源的所有chunks
    const chunks = POLICY_DATA.chunks.filter(c => c.source === source);
    let fullText = chunks.map(c => c.text).join('\n\n');
    
    // 提取文件名称（不带扩展名）
    const fileName = source.replace(/\.(docx|pdf|txt)$/, '');
    
    // 尝试从文本中提取更多元数据
    const firstChunk = chunks[0]?.text || '';
    const publishMatch = firstChunk.match(/【公布日期】([^\n]+)/) || firstChunk.match(/发布时间[：:]\s*([^\n]+)/) || firstChunk.match(/(\d{4}年\d{1,2}月\d{1,2}日)/);
    const orgMatch = firstChunk.match(/【制定机关】([^\n]+)/) || firstChunk.match(/发布单位[：:]\s*([^\n]+)/) || firstChunk.match(/北京市([^\n]+?)(委员会|局|办公室|政府)/);
    
    const publishDate = publishMatch ? publishMatch[1].trim() : '未注明发布时间';
    const publishOrg = orgMatch ? orgMatch[1].trim() : '未注明发布单位';

    document.getElementById('modal-title').textContent = fileName;
    document.getElementById('modal-meta').innerHTML = `
        <div><strong>文件名称:</strong> ${escapeHtml(source)}</div>
        <div><strong>专题分类:</strong> ${escapeHtml(topic)}</div>
        <div><strong>发布时间:</strong> ${escapeHtml(publishDate)} | <strong>发布单位:</strong> ${escapeHtml(publishOrg)}</div>
        <div><strong>所属文件夹:</strong> ${chunks[0]?.folder || '未知'} | <strong>文本块数:</strong> ${chunks.length}</div>
    `;
    document.getElementById('modal-content').textContent = fullText;
    document.getElementById('modal-overlay').classList.add('visible');
}

function closeModal() {
    document.getElementById('modal-overlay').classList.remove('visible');
}

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.toggle('mobile-open');
    overlay.classList.toggle('visible');
}

function closeSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.remove('mobile-open');
    overlay.classList.remove('visible');
}

function quickAsk(question) {
    document.getElementById('chat-input').value = question;
    sendMessage();
}

// ==================== 专题管理 ====================
function renderTopics() {
    const list = document.getElementById('topic-list');
    const topicStats = POLICY_DATA.topic_stats || {};
    const totalChunks = POLICY_DATA.total_chunks;

    document.getElementById('topic-count').textContent = `${Object.keys(topicStats).length} 个专题`;

    let html = `
        <div class="topic-item ${selectedTopic === null ? 'active' : ''}" onclick="selectTopic(null);closeSidebar()">
            <span class="topic-name">📋 全部专题</span>
            <span class="topic-desc">查看所有政策专题内容</span>
            <span class="topic-badge">${totalChunks}</span>
        </div>
    `;

    const topics = POLICY_DATA.topics || Object.keys(topicStats);
    topics.forEach(topic => {
        const count = topicStats[topic] || 0;
        const description = POLICY_DATA.topic_descriptions?.[topic] || '';
        const active = selectedTopic === topic ? 'active' : '';
        html += `
            <div class="topic-item ${active}" onclick="selectTopic('${escapeHtml(topic)}');closeSidebar()" title="${escapeHtml(topic)}">
                <span class="topic-name">${topic}</span>
                <span class="topic-desc">${description}</span>
                <span class="topic-badge">${count}</span>
            </div>
        `;
    });

    list.innerHTML = html;
}

function selectTopic(topic) {
    selectedTopic = topic;
    const indicator = document.getElementById('filter-indicator');
    const filterName = document.getElementById('filter-name');
    if (topic) {
        indicator.classList.add('visible');
        filterName.textContent = topic.length > 20 ? topic.substring(0,20)+'...' : topic;
    } else {
        indicator.classList.remove('visible');
    }
    renderTopics();
}

// ==================== 会话管理 ====================
function newConversation() {
    conversationId = 'conv_' + Date.now().toString(36);
    const container = document.getElementById('chat-messages');
    container.innerHTML = `
        <div class="welcome-message" id="welcome">
            <div class="welcome-icon">🏛️</div>
            <h2>北京城市更新政策问答</h2>
            <p>基于《北京市城市更新条例》及配套政策文件的纯前端RAG智能问答系统。</p>
            <p style="font-size:12px;color:var(--text-secondary);margin-top:4px">
                已加载 <strong>${POLICY_DATA.total_chunks}</strong> 个文本块，覆盖 <strong>${POLICY_DATA.total_files}</strong> 个政策文件
            </p>
            <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px">
                <span class="quick-ask-tag" onclick="quickAsk('北京市城市更新条例的主要内容是什么？')">条例主要内容</span>
                <span class="quick-ask-tag" onclick="quickAsk('土地规划政策有哪些核心要点？')">土地规划政策</span>
                <span class="quick-ask-tag" onclick="quickAsk('城市更新的资金支持政策包含哪些？')">资金支持政策</span>
                <span class="quick-ask-tag" onclick="quickAsk('审批优化政策有哪些措施？')">审批优化</span>
            </div>
        </div>
    `;
    selectedTopic = null;
    selectTopic(null);
    showToast('已创建新对话');
}

function exportConversation() {
    const messages = document.querySelectorAll('.message');
    const exportData = {
        conversation_id: conversationId,
        export_time: new Date().toISOString(),
        system: '北京城市更新政策问答 PWA',
        messages: []
    };
    messages.forEach(msg => {
        const isUser = msg.classList.contains('user');
        const bubble = msg.querySelector('.bubble');
        if (bubble) {
            exportData.messages.push({
                role: isUser ? 'user' : 'assistant',
                content: bubble.textContent.trim()
            });
        }
    });
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `政策问答_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('导出成功');
}

// ==================== 工具函数 ====================
function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('visible');
    setTimeout(() => toast.classList.remove('visible'), 2000);
}
